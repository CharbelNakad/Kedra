# The backend accepts conditional writes but cannot require their header in bucket policies.
# Only this gateway is published on the host; Docker administrators remain trusted.
events {}
http {
    access_log off;
    server_tokens off;
    client_max_body_size 32m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream object_backend {
        zone object_backend 64k;
        server seaweedfs:8333 resolve;
    }

    map $request_method $reject_method {
        default 1;
        GET 0;
        HEAD 0;
        PUT 0;
    }
    # Classify the original URI, not a normalized path that could hide encoded slashes/dot segments.
    # Only bucket creation and policy provisioning may omit the object-creation precondition.
    map "$request_method:$request_uri" $object_put {
        default 0;
        ~^PUT:/[a-z0-9-]+(?:\?policy)?$ 0;
        ~^PUT: 1;
    }
    map "$object_put:$http_if_none_match" $reject_precondition {
        default 0;
        "1:*" 0;
        ~^1: 1;
    }
    map "$object_put:$args" $reject_object_query {
        default 0;
        ~^1:.+ 1;
    }
    # Copy and competing conditional headers could select a different write path in the backend.
    map "$object_put:$http_x_amz_copy_source$http_if_match$http_if_modified_since$http_if_unmodified_since" $reject_other_write {
        default 0;
        ~^1:.+ 1;
    }

    server {
        listen 8333;
        location = /_healthz { return 200 "ready\n"; }
        location / {
            if ($reject_method) { return 403; }
            if ($reject_precondition) { return 403; }
            if ($reject_object_query) { return 403; }
            if ($reject_other_write) { return 403; }
            proxy_set_header Host $http_host;
            proxy_pass http://object_backend;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
