# Non-secret defaults. Copy to ignored config.local.toml to customize.
[source]
name = "workplace-relations"
search_url = "https://www.workplacerelations.ie/en/search/"
body_ids = ["2", "1", "3", "15376"]

[scraping]
partition_size = "month" # "month" or "day"
download_delay_seconds = 2.0
concurrency_per_domain = 1
timeout_seconds = 25.0
retry_times = 3
max_response_bytes = 20971520
max_pages_per_partition = 1000 # fail visibly instead of following an unbounded pager

[storage]
mongo_database = "kedra"
landing_collection = "landing_metadata"
transformed_collection = "transformed_metadata"
state_collection = "crawl_state"
s3_endpoint_url = "http://localhost:8333"
s3_region = "us-east-1"
landing_bucket = "kedra-landing"
transformed_bucket = "kedra-transformed"
object_prefix = "workplace-relations"
connect_timeout_seconds = 5
read_timeout_seconds = 30
max_attempts = 3

# Required only in the environment, never committed:
# KEDRA_MONGO_URI, KEDRA_S3_ACCESS_KEY_ID, KEDRA_S3_SECRET_ACCESS_KEY
